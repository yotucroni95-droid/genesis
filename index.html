<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070a1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Gênesis — uma aventura pelo primeiro livro da Bíblia.">
  <title>Gênesis</title>
  <link rel="icon" href="assets/logo/icon-192.png?v=2" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/logo/icon-180.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Gênesis">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=82">
</head>
<body>
  <main id="game" aria-label="Gênesis">
    <canvas id="screen"></canvas>
    <div id="ui"></div>

    <div id="boot" class="boot">
      <div class="boot__title">Gênesis</div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="bar__fill"></div>
      </div>
      <div class="boot__label">Carregando…</div>
    </div>

    <div id="rotate" class="rotate" aria-live="polite">
      <div class="rotate__phone"></div>
      <p>Gire o celular para ficar <strong>deitado</strong></p>
      <small>O Gênesis é jogado com o celular deitado.</small>
      <small class="rotate__help">Virou e a tela não girou? A rotação automática do celular está travada: destrave no painel de atalhos (deslize o dedo do topo da tela) e vire de novo.</small>
      <div class="rotate__actions">
        <button class="btn rotate__turn" type="button">Girar a tela</button>
        <button class="btn btn--ghost rotate__copy" type="button" hidden>Copiar o link do jogo</button>
      </div>
    </div>
  </main>

  <noscript>Para jogar, ative o JavaScript do navegador.</noscript>
  <script type="module" src="src/main.js?v=82"></script>
</body>
</html>
